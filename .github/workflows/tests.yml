name: tests

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run on the same ref, so a quick
# follow-up commit does not leave two runs racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Brackets the supported range: the floor declared in pyproject and a
      # current version. Colab sits between them.
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,store]'

      - name: Tests
        # The suite is fully offline — the UniProt fetcher is injectable and
        # the tests pass a fake one — so no network access is needed here.
        run: pytest -q

      - name: Scripts are importable
        # The scripts are not covered by tests, so a bad import in one would
        # otherwise surface only when you run it in Colab — the worst place to
        # find out. Importing is safe: each script's work sits behind
        # `if __name__ == "__main__"`.
        env:
          PYTHONPATH: scripts
        run: |
          python -c "
          import prepare_data, fetch_sequences, make_splits, embed, train
          import mutstab, mutstab.data, mutstab.features, mutstab.models, mutstab.eval
          print('scripts and package import clean')
          "

      - name: Configs load
        run: |
          python -c "
          from mutstab.config import load_config
          for name in ('baseline', 'properties_only'):
              cfg = load_config(name)
              print(f'{name}: run_id={cfg.run_id}')
          "
