[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutstab"
version = "0.1.0"
description = "Predicting the effect of point mutations on protein melting temperature (Tm)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Embedding caches. Kept optional so a plain `pip install -e .` stays fast in Colab.
store = ["h5py>=3.9"]
# Protein language model inference. Install only in the session that computes embeddings.
plm = ["torch>=2.0", "fair-esm>=2.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
